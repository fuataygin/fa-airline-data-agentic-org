name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Live data-connection smoke test
        run: pytest tests/test_sheets_tool.py -v

      # The full 5-agent pipeline calls the Anthropic API and costs real
      # tokens, so it's opt-in rather than run on every push. Add
      # ANTHROPIC_API_KEY as a repo secret and uncomment to run it in CI:
      #
      # - name: Run full agentic pipeline
      #   env:
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      #   run: python main.py
